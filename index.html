const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const singular={Polpo:'Polpi',Polpi:'Polpi',Gambero:'Gamberi',Gamberi:'Gamberi',Mollusco:'Molluschi',Molluschi:'Molluschi',Branzino:'Branzini',Branzini:'Branzini',Sardina:'Sardine',Sardine:'Sardine'};
const parseRecipe=s=>Object.fromEntries(s.split(',').map(x=>{const [,n,f]=x.trim().match(/(\d+)\s+(.+)/);return[singular[f],+n]}));
const cleanUpgrade=s=>s.replace(/^[^\s]+\s+/,'').replace(' (+3)','').replace(/^L’/,"L'");
const CARDS=RAW.trim().split('\n').map(line=>{const [id,name,bid,value,fish,upgrade]=line.split('|');return{id:+id,name,bid:+bid,value:+value,fish,recipe:parseRecipe(fish),upgrade,up:cleanUpgrade(upgrade)}});
const upgradePhase=s=>s.startsWith('⚓')?'rete':s.startsWith('🔨')?'asta':s.startsWith('⚖')?'bilancia':'pubblico';
class RNG{constructor(seed){this.s=(seed>>>0)||1}next(){this.s=(this.s+0x6D2B79F5)|0;let t=this.s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}int(n){return Math.floor(this.next()*n)}shuffle(a){for(let i=a.length-1;i;i--){const j=this.int(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}}
let G=null;
const inv=()=>Object.fromEntries(FISH.map(f=>[f,0]));
const count=o=>FISH.reduce((n,f)=>n+(o[f]||0),0);
const hasUp=(p,u)=>p.upgrades.has(u);
const cap=(p,kind)=>6+(kind==='fresh'&&hasUp(p,'Banco Migliorato')?3:0);
const mix=(a,b)=>Object.fromEntries(FISH.map(f=>[f,(a[f]||0)+(b[f]||0)]));
const hasRecipe=(stock,r)=>Object.entries(r).every(([f,n])=>(stock[f]||0)>=n);
const fishText=r=>Object.entries(r).map(([f,n])=>`<span class="recipe-item"><b>${n}</b><img class="recipe-fish" src="${ASSET.fish[f]}" alt="${f}"></span>`).join('');

function log(phase,text){G.log.push({day:G.day,phase,text});if(G.log.length>80)G.log.shift()}
function drawFish(){if(!G.bag.length)return null;return G.bag.pop()}
function returnFish(f,n=1){for(let i=0;i<n;i++)G.bag.push(f)}
function drawCard(){if(!G.deck.length){G.deck=G.rng.shuffle(G.discard.splice(0));log('Mazzo','Gli scarti sono stati rimescolati.')}return G.deck.pop()}
function addFresh(p,f,n=1){const take=Math.min(n,cap(p,'fresh')-count(p.fresh));p.fresh[f]+=Math.max(0,take);return Math.max(0,take)}
function need(p,f){let n=0;for(const c of p.hand)n=Math.max(n,(c.recipe[f]||0)-p.fresh[f]-p.stale[f]);return Math.max(0,n)}
function bestFish(p,available=FISH){return[...available].sort((a,b)=>need(p,b)-need(p,a)||G.rng.next()-.5)[0]}
function takeDesiredFromBag(p){const wanted=[...FISH].sort((a,b)=>need(p,b)-need(p,a));for(const f of wanted){const i=G.bag.lastIndexOf(f);if(i>=0&&addFresh(p,f)){G.bag.splice(i,1);log('Miglioria',`${p.name} usa Fiuto per il Pescato e trova ${ICON[f]} ${f}.`);return}}}
function activate(p){for(const u of p.pending)p.upgrades.add(u);p.pending.clear()}

window.newGame=function(){
  const n=+$('playerCount').value,name=$('playerName').value.trim()||'Mercante',seed=+$('seed').value||1,difficulty=$('difficulty').value;
  const rng=new RNG(seed),bag=[];for(const f of FISH)for(let i=0;i<20;i++)bag.push(f);
  G={rng,day:1,phase:'rete',difficulty,players:Array.from({length:n},(_,id)=>({id,name:id?BOTNAMES[id-1]:name,human:id===0,coins:10,fresh:inv(),stale:inv(),hand:[],upgrades:new Set(),pending:new Set(),favorite:null,orders:0,waste:0,passedAll:false,freeBuy:false,todayOrders:0})),bag:rng.shuffle(bag),deck:rng.shuffle(CARDS.map(c=>({...c}))),discard:[],captain:0,public:[],market:inv(),log:[],selectedBid:null,bidCash:0};
  document.body.classList.add('playing');$('setup').classList.add('hidden');$('end').classList.add('hidden');$('game').classList.remove('hidden');startDay();
};
window.restartGame=function(){if(G&&!G.finished&&!confirm('Abbandonare la partita in corso?'))return;G=null;document.body.classList.remove('playing');$('game').classList.add('hidden');$('end').classList.add('hidden');$('setup').classList.remove('hidden')};

function startDay(){
  for(const p of G.players){activate(p);p.passedAll=false;p.freeBuy=false;p.todayOrders=0}
  for(const p of G.players)if(hasUp(p,'Fiuto per il Pescato'))takeDesiredFromBag(p);
  G.market=inv();G.nets=G.players.map(()=>{const net=[];for(let i=0;i<6;i++){const f=drawFish();if(f)net.push(f)}return net});
  G.netOrder=Array.from({length:G.players.length},(_,i)=>(G.captain+i)%G.players.length);G.netPos=0;G.phase='rete';
  log('Giorno',`Comincia il giorno ${G.day}. ${G.players[G.captain].name} è Capitano.`);advanceNet();
}
function advanceNet(){
  while(G.netPos<G.netOrder.length){const p=G.players[G.netOrder[G.netPos]],net=G.nets[p.id];if(p.human){render();return}const f=bestFish(p,net);net.splice(net.indexOf(f),1);addFresh(p,f);for(const left of net)G.market[left]++;G.nets[p.id]=[];log('Rete',`${p.name} sceglie ${ICON[f]} ${f}; gli altri 5 pesci vanno al mercato.`);G.netPos++}
  const wholesale=count(G.market);log('Rete',`${wholesale} pesci confluiscono nel mercato all’ingrosso.`);startDraft();
}
function startDraft(){
  G.phase='draft';G.draftRound=1;G.draftDirection=G.day%2?1:-1;G.drafted=G.players.map(()=>[]);G.draftPacks=G.players.map(()=>Array.from({length:5},drawCard).filter(Boolean));log('Draft',`Inizia il draft: pacchetti di 5 carte verso ${G.draftDirection===1?'sinistra':'destra'}.`);render()
}
function draftScore(p,c){const freshUpgrade=!p.upgrades.has(c.up)&&!p.pending.has(c.up)?2:0,base=c.value*.55+c.bid*.7+freshUpgrade;return G.difficulty==='easy'?G.rng.next()*12:base+G.rng.next()*(G.difficulty==='hard'?1:4)}
function botDraft(p,pack){return[...pack].sort((a,b)=>draftScore(p,b)-draftScore(p,a))[0]}
window.pickDraft=function(id){
  if(G.phase!=='draft')return;const mine=G.draftPacks[0],chosen=mine.find(c=>c.id===id);if(!chosen)return;
  const picks=G.players.map((p,i)=>i===0?chosen:botDraft(p,G.draftPacks[i]));
  for(const p of G.players){const pack=G.draftPacks[p.id],card=picks[p.id];pack.splice(pack.indexOf(card),1);G.drafted[p.id].push(card)}
  log('Draft',`${G.players[0].name} sceglie “${chosen.name}” al giro ${G.draftRound}.`);
  if(!G.draftPacks[0].length){finishDraft();return}
  const passed=Array(G.players.length);for(let i=0;i<G.players.length;i++)passed[(i+G.draftDirection+G.players.length)%G.players.length]=G.draftPacks[i];G.draftPacks=passed;G.draftRound++;render()
};
function finishDraft(){
  for(const p of G.players)p.hand.push(...G.drafted[p.id]);log('Draft','Draft completato: le 5 carte scelte si aggiungono alle carte conservate.');G.public=Array.from({length:5},drawCard).filter(Boolean);G.auctionTypes=FISH.filter(f=>G.market[f]);
  const c=G.players[G.captain];G.auctionIndex=0;G.phase='asta';G.auctionStage=(c.human&&hasUp(c,"L'Eco del Capitano")&&G.auctionTypes.length>1)?'choose':'bid';
  if(!c.human&&hasUp(c,"L'Eco del Capitano")){const first=bestFish(c,G.auctionTypes);G.auctionTypes=[first,...G.auctionTypes.filter(f=>f!==first)];log('Miglioria',`${c.name} usa Eco del Capitano: ${first} per primi.`)}
  render();
}
window.pickNet=function(f){if(G.phase!=='rete'||G.players[G.netOrder[G.netPos]].id!==0)return;const net=G.nets[0],i=net.indexOf(f);if(i<0)return;net.splice(i,1);addFresh(G.players[0],f);for(const left of net)G.market[left]++;G.nets[0]=[];log('Rete',`${G.players[0].name} sceglie ${ICON[f]} ${f}; gli altri 5 pesci vanno al mercato.`);G.netPos++;advanceNet()};
window.chooseFirstAuction=function(f){if(G.auctionStage!=='choose')return;G.auctionTypes=[f,...G.auctionTypes.filter(x=>x!==f)];G.auctionStage='bid';log('Miglioria',`Scegli ${f} come prima asta.`);render()};

function currentFish(){return G.auctionTypes[G.auctionIndex]}
function botBid(p,f){
  if(!p.hand.length||count(p.fresh)>=cap(p,'fresh'))return null;
  const factor={easy:.65,normal:.85,hard:1.05}[G.difficulty],target=Math.min(12,Math.round((need(p,f)+.7)*3*factor)),cards=[...p.hand].sort((a,b)=>a.bid-b.bid);
  if(target<2&&G.rng.next()<.65)return null;const card=cards.find(c=>c.bid>=target)||cards.at(-1),bonus=hasUp(p,'Capitano delle Aste')?2:0,cash=Math.min(p.coins,Math.max(0,target-card.bid-bonus));
  p.hand.splice(p.hand.indexOf(card),1);G.discard.push(card);return{pid:p.id,card,cash,score:card.bid+cash+bonus};
}
window.chooseBid=function(id){if(G.phase!=='asta'||G.auctionStage!=='bid'||!G.players[0].hand.some(c=>c.id===id))return;G.selectedBid=id;G.bidCash=0;render()};
window.returnBidCard=function(){if(G.phase!=='asta'||G.auctionStage!=='bid')return;G.selectedBid=null;G.bidCash=0;render()};
function syncBidCash(){const available=Math.max(0,G.players[0].coins-G.bidCash),source=$('bidCoinSource'),wallet=$('bidWalletCount'),stack=$('offerCoins'),total=$('offerCoinCount');if(wallet)wallet.textContent=available;if(source)source.disabled=!G.selectedBid||!available;if(total)total.textContent=G.bidCash;if(stack)stack.classList.toggle('hidden',!G.bidCash)}
function flyBidCoin(from){const target=$('humanOfferCard');if(!target||reducedMotion)return;const to=target.getBoundingClientRect(),coin=document.createElement('span');coin.className='flying-ducat';coin.style.left=from.left+from.width/2-23+'px';coin.style.top=from.top+from.height/2-23+'px';document.body.appendChild(coin);if(window.gsap)gsap.to(coin,{left:to.left+to.width/2-23,top:to.top+to.height/2-23,rotation:720,scale:.72,duration:.52,ease:'power2.inOut',onComplete:()=>coin.remove()});else coin.animate([{transform:'translate(0) rotate(0)'},{transform:`translate(${to.left-from.left}px,${to.top-from.top}px) rotate(720deg) scale(.72)`}],{duration:520,easing:'ease-in-out'}).finished.then(()=>coin.remove())}
window.addBidCoin=function(e){if(G.phase!=='asta'||G.auctionStage!=='bid'||!G.selectedBid||G.bidCash>=G.players[0].coins)return;const from=e.currentTarget.getBoundingClientRect();G.bidCash++;syncBidCash();flyBidCoin(from)};
window.removeBidCoin=function(e){e.stopPropagation();if(G.phase!=='asta'||G.auctionStage!=='bid'||!G.bidCash)return;G.bidCash--;syncBidCash()};
window.submitBid=function(mode='bid'){
  if(G.phase!=='asta'||G.auctionStage!=='bid')return;const me=G.players[0],f=currentFish();
  if(mode==='all')me.passedAll=true;
  let human=null;if(mode==='bid'){const card=me.hand.find(c=>c.id===G.selectedBid);if(!card)return;me.hand.splice(me.hand.indexOf(card),1);G.discard.push(card);human={pid:0,card,cash:G.bidCash,score:card.bid+G.bidCash+(hasUp(me,'Capitano delle Aste')?2:0)}}else if(mode==='pass'&&me.coins>0){me.coins--;log('Asta','Rinunci all’asta e paghi 1 Ducato.')}
  const bids=[];if(human)bids.push(human);for(const p of G.players.slice(1)){const b=botBid(p,f);if(b)bids.push(b)}resolveBids(bids);
};
function resolveBids(bids){
  const f=currentFish();if(!bids.length){log('Asta',`Nessuna offerta per ${f}.`);finishAuction();return}
  bids.sort((a,b)=>b.score-a.score||(G.rng.next()-.5));const win=bids[0];G.players[win.pid].coins-=win.cash;G.captain=win.pid;
  G.auctionResult=bids;G.buyQueue=bids.map((b,i)=>({pid:b.pid,price:i===0?1:(hasUp(G.players[b.pid],'Mercante Astuto')?1:i===1?2:3),rank:i}));G.buyPos=0;G.auctionStage='buy';
  log('Asta',`${G.players[win.pid].name} vince l’asta dei ${f} con ${win.score}.`);advanceBuys();
}
function buyCost(p,n,unit){return Math.max(0,n*unit-(n>0&&hasUp(p,'Amico dei Pescatori')&&!p.freeBuy?1:0))}
function buy(p,f,n,unit){n=Math.max(0,Math.min(n,G.market[f],cap(p,'fresh')-count(p.fresh)));while(n&&buyCost(p,n,unit)>p.coins)n--;const cost=buyCost(p,n,unit);if(n){p.coins-=cost;p.fresh[f]+=n;G.market[f]-=n;if(hasUp(p,'Amico dei Pescatori')&&!p.freeBuy)p.freeBuy=true;log('Acquisto',`${p.name} compra ${n} ${f} per ${cost} Ducati.`)}return n}
function botBuy(p,f,price,rank){const room=cap(p,'fresh')-count(p.fresh),afford=price?Math.floor((p.coins+(hasUp(p,'Amico dei Pescatori')&&!p.freeBuy?1:0))/price):G.market[f];let n=Math.min(G.market[f],room,afford,Math.max(rank===0?1:0,need(p,f)));if(G.difficulty==='hard'&&G.rng.next()<.35)n=Math.min(n+1,G.market[f],room,afford);buy(p,f,n,price)}
function advanceBuys(){
  const f=currentFish();while(G.buyPos<G.buyQueue.length&&G.market[f]){const q=G.buyQueue[G.buyPos],p=G.players[q.pid];if(p.human){const max=maxBuy(p,f,q.price);G.buyQty=Math.min(max,q.rank===0?1:0);render();return}botBuy(p,f,q.price,q.rank);G.buyPos++}
  finishAuction();
}
function maxBuy(p,f,price){return Math.min(G.market[f],cap(p,'fresh')-count(p.fresh),price?Math.floor((p.coins+(hasUp(p,'Amico dei Pescatori')&&!p.freeBuy?1:0))/price):G.market[f])}
window.toggleBuyToken=function(n){G.buyQty=G.buyQty===n?n-1:n;render()};
window.confirmBuy=function(){const q=G.buyQueue[G.buyPos],p=G.players[0];buy(p,currentFish(),G.buyQty||0,q.price);G.buyPos++;advanceBuys()};
function finishAuction(){G.auctionIndex++;G.selectedBid=null;G.bidCash=0;G.buyQty=0;G.auctionResult=null;G.buyQueue=null;while(G.auctionIndex<G.auctionTypes.length&&!G.market[currentFish()])G.auctionIndex++;if(G.auctionIndex>=G.auctionTypes.length){startClearance();return}G.auctionStage='bid';if(G.players[0].passedAll)submitBid('none');else render()}
function startClearance(){G.auctionStage='clearance';G.clearQty=inv();if(G.players[0].passedAll){botClearance();startPublic()}else render()}
window.toggleClearToken=function(f,n){const me=G.players[0],next=G.clearQty[f]===n?n-1:n,total=FISH.reduce((sum,x)=>sum+(x===f?next:G.clearQty[x]),0);if(total<=cap(me,'fresh')-count(me.fresh)&&total<=me.coins)G.clearQty[f]=next;render()};
window.confirmClearance=function(){
  const me=G.players[0],room=cap(me,'fresh')-count(me.fresh),chosen=FISH.map(f=>[f,G.clearQty[f]||0]),sum=chosen.reduce((n,[,q])=>n+q,0);if(sum>room||sum>me.coins||chosen.some(([f,q])=>q>G.market[f])){alert('Quantità non valida: controlla spazio, Ducati e pesce disponibile.');return}for(const[f,q]of chosen)buy(me,f,q,1);botClearance();startPublic()
};
function botClearance(){for(const f of FISH)for(const p of G.players.slice(1))if(G.market[f])botBuy(p,f,1,3);for(const f of FISH){returnFish(f,G.market[f]);G.market[f]=0}}

function resolvedRecipe(p,card,privateSale){const stock=privateSale?mix(p.fresh,p.stale):p.fresh,r={...card.recipe};if(hasRecipe(stock,r))return r;if(privateSale&&hasUp(p,'Contrattazione')){const missing=FISH.filter(f=>(r[f]||0)>(stock[f]||0));if(missing.length===1&&(r[missing[0]]||0)-(stock[missing[0]]||0)===1){const sub=FISH.find(f=>f!==missing[0]&&(stock[f]||0)-(r[f]||0)>=2);if(sub){r[missing[0]]--;r[sub]=(r[sub]||0)+2;if(hasRecipe(stock,r))return r}}}return null}
function canOrder(p,c,priv=false){return!!resolvedRecipe(p,c,priv)}
function spendRecipe(p,r,priv){for(const f of FISH){let n=r[f]||0;if(priv){const old=Math.min(n,p.stale[f]);p.stale[f]-=old;n-=old}p.fresh[f]-=n}}
function completeOrder(p,card,priv){const r=resolvedRecipe(p,card,priv);if(!r)return false;spendRecipe(p,r,priv);let bonus=0;if(hasUp(p,'Maestro della Bilancia')&&p.todayOrders===0)bonus+=2;if(hasUp(p,"L'Arte del Venditore"))bonus+=2;if(hasUp(p,'Favorito della Gilda')&&card.recipe[p.favorite])bonus+=3;p.coins+=card.value+bonus;p.orders++;p.todayOrders++;p.pending.add(card.up);if(card.up==='Favorito della Gilda'&&!p.favorite)p.favorite=Object.entries(card.recipe).sort((a,b)=>b[1]-a[1])[0][0];log('Ordine',`${p.name} serve “${card.name}”: +${card.value+bonus} Ducati, ${card.up} dal prossimo giorno.`);return true}
function startPublic(){G.phase='pubblico';G.publicTurn=G.captain;G.publicPass=0;log('Pescheria','Apre il mercato al minuto.');advancePublic()}
function advancePublic(){
  while(G.public.length&&G.publicPass<G.players.length){const p=G.players[G.publicTurn];if(p.human){render();return}const card=[...G.public].filter(c=>canOrder(p,c)).sort((a,b)=>b.value-a.value)[0];if(card){completeOrder(p,card,false);G.public.splice(G.public.indexOf(card),1);G.publicPass=0}else G.publicPass++;G.publicTurn=(G.publicTurn+1)%G.players.length}
  startPrivate();
}
window.servePublic=function(id){if(G.phase!=='pubblico'||G.publicTurn!==0)return;const c=G.public.find(x=>x.id===id);if(!c||!completeOrder(G.players[0],c,false))return;G.public.splice(G.public.indexOf(c),1);G.publicPass=0;G.publicTurn=(G.publicTurn+1)%G.players.length;advancePublic()};
window.passPublic=function(){if(G.phase!=='pubblico'||G.publicTurn!==0)return;G.publicPass++;G.publicTurn=(G.publicTurn+1)%G.players.length;advancePublic()};
function startPrivate(){for(const c of G.public)G.discard.push(c);G.public=[];G.phase='privato';for(const p of G.players.slice(1)){let moved=true;while(moved){moved=false;const c=[...p.hand].filter(x=>canOrder(p,x,true)).sort((a,b)=>b.value-a.value)[0];if(c){completeOrder(p,c,true);p.hand.splice(p.hand.indexOf(c),1);moved=true}}}render()}
window.servePrivate=function(id){if(G.phase!=='privato')return;const p=G.players[0],c=p.hand.find(x=>x.id===id);if(c&&completeOrder(p,c,true)){p.hand.splice(p.hand.indexOf(c),1);render()}};
window.finishPrivate=function(){if(G.phase!=='privato')return;disposeAndAccount()};
function disposeAndAccount(){
  for(const p of G.players){const old=count(p.stale);for(const f of FISH){returnFish(f,p.stale[f]);p.stale[f]=0}let cost=hasUp(p,'Patto di Scarto')?0:old*2,room=6;let excess=0;for(const f of FISH){const move=Math.min(room,p.fresh[f]);p.fresh[f]-=move;p.stale[f]+=move;room-=move;if(p.fresh[f]){excess+=p.fresh[f];returnFish(f,p.fresh[f]);p.fresh[f]=0}}if(!hasUp(p,'Patto di Scarto'))cost+=excess*2;p.coins-=cost;p.waste+=old+excess;if(hasUp(p,'Rendita dal Banco'))p.coins+=3;log('Bilancia',`${p.name}: ${old+excess} scarti, ${cost} Ducati di costo${hasUp(p,'Rendita dal Banco')?', +3 di Rendita':''}.`)}
  if(G.day<4)for(const p of G.players.slice(1)){p.hand.sort((a,b)=>(b.value+b.bid)-(a.value+a.bid));while(p.hand.length>2)G.discard.push(p.hand.pop())}
  G.phase='bilancia';G.keep=new Set(G.day<4&&G.players[0].hand.length<=2?G.players[0].hand.map(c=>c.id):[]);render();
}
window.toggleKeep=function(id){if(G.phase!=='bilancia'||G.day===4)return;if(G.keep.has(id))G.keep.delete(id);else if(G.keep.size<2)G.keep.add(id);render()};
window.finishDay=function(){
  const me=G.players[0];if(G.day<4)for(const c of [...me.hand])if(!G.keep.has(c.id)){G.discard.push(c);me.hand.splice(me.hand.indexOf(c),1)}
  const oldCap=G.captain;G.captain=[...G.players].sort((a,b)=>b.coins-a.coins||b.upgrades.size-a.upgrades.size||(a.id===oldCap?-1:1))[0].id;
  if(G.day===4){finishGame();return}G.day++;startDay();

function finishGame(){for(const p of G.players){const left=count(p.fresh)+count(p.stale);p.coins-=left;p.waste+=left}const ranked=[...G.players].sort((a,b)=>b.coins-a.coins||b.upgrades.size-a.upgrades.size);G.finished=true;document.body.classList.remove('playing');$('game').classList.add('hidden');$('end').classList.remove('hidden');$('end').innerHTML=`<div class="trophy">${ranked[0].id===0?'🏆':'⚓'}</div><div class="eyebrow">Partita conclusa</div><h2>${ranked[0].id===0?'Hai vinto!':esc(ranked[0].name)+' vince'}</h2><p>Dopo quattro giorni di mercato, il mercante più ricco di Venezia ha ${ranked[0].coins} Ducati.</p><div class="rank">${ranked.map((p,i)=>`<div class="rankrow"><div class="place">${i+1}°</div><div class="who"><i class="dot" style="background:${COLORS[p.id]}"></i>${esc(p.name)}${p.id===0?' (tu)':''}</div><b>${p.coins} ◈ · ${p.orders} ordini</b></div>`).join('')}</div><button class="btn primary" onclick="restartGame()">Gioca ancora</button>`}

function scoreCard(p){return`<article class="panel score ${p.id===G.captain?'captain':''} ${p.id===0?'you':''}"><div class="who"><i class="dot" style="background:${COLORS[p.id]}"></i>${esc(p.name)} ${p.id===G.captain?'⚓':''}</div><div class="money">${p.coins} ◈</div><div class="sub">${p.orders} ordini · ${p.upgrades.size} migliorie</div></article>`}
function physicalPhase(){return G.phase==='asta'?1:(G.phase==='pubblico'||G.phase==='privato')?2:G.phase==='bilancia'?3:0}

function humanArea(p,color){

  if(G.phase==='asta'&&G.auctionStage==='clearance'){const n=FISH.reduce((s,f)=>s+G.clearQty[f],0);return zone(`<div><b>${n} PESCI</b><small>1 Ducato ciascuno</small></div><button class="player-action-btn" onclick="confirmClearance()">CONFERMA</button>`)}

  $('physicalBoard').innerHTML=`<div class="board-hud"><strong>Mercato di Pescaria</strong><div class="board-hud-tools"><div class="board-hud-status"><span>Giorno ${G.day} · ${phaseTitle(G.phase==='privato'?'pubblico':G.phase)}</span><span>Mazzo ${G.deck.length} · Sacchetto ${G.bag.length}</span></div><button id="restart" class="board-new-game" onclick="restartGame()">Nuova partita</button></div></div><div id="boardScores" class="board-scorebar"></div><div class="board-calendar"><div class="board-days">${days}</div><div class="board-phases">${phases}</div></div><div class="board-center"><div class="board-market-title">Pescato disponibile per le aste</div><div class="board-fish">${lots}</div><div class="board-offer-title">Aree dei giocatori</div><div class="board-offers ${bidding?'auction-bidding':''} ${offers.includes('human-action')?'player-actions':''}">${offers}</div><div class="board-player-pins">${playerPins}</div></div><section id="boardHand" class="panel board board-hand"></section>${overlay}`
}
function inventoryHtml(stock,muted=false){const x=FISH.flatMap(f=>Array.from({length:stock[f]},()=>`<span class="token ${muted?'muted-token':''}" title="${f}"><img src="${ASSET.fish[f]}" alt="${f}"></span>`)).join('');return x||'<span class="empty">vuoto</span>'}
function cardHtml(c,mode='plain',enabled=true,style=''){const selected=(mode==='bid'&&G.selectedBid===c.id)||(mode==='keep'&&G.keep.has(c.id)),locked=mode==='draft'&&!enabled,selectable=enabled&&['bid','keep','draft','public','private'].includes(mode),fn={bid:'chooseBid',keep:'toggleKeep',draft:'pickDraft',public:'servePublic',private:'servePrivate'}[mode],phase=upgradePhase(c.upgrade),suit={rete:'anchor',asta:'hammer',bilancia:'scale',pubblico:'coin'}[phase],select=selectable?`role="button" tabindex="0" onclick="${fn}(${c.id})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();${fn}(${c.id})}"`:'';return`<article class="card suit-${suit} ${selectable?'selectable':''} ${selected?'selected':''} ${locked?'draft-locked':!enabled?'disabled':''}" ${style?`style="${style}"`:''} ${select}>${locked?'<span class="draft-lock" title="Carta già scelta" aria-label="Carta già scelta">🔒</span>':''}<div class="card-top"><span class="bid" title="Valore asta"><strong>${c.bid}</strong></span><div><span class="card-id">ORDINE #${c.id}</span><h4>${esc(c.name)}</h4></div></div><div class="recipe">${fishText(c.recipe)}</div><div class="payout">${c.value} Ducati</div><div class="upgrade"><img src="${ASSET.upgrade[c.up]}" alt="" aria-hidden="true"><div><b><img class="upgrade-phase" src="${ASSET.phase[phase]}" alt="Fase ${phase==='rete'?'Ingrosso':phase==='asta'?'Aste':phase==='pubblico'?'Pescheria':'Bilancia'}">${esc(c.up)}</b><small>${esc(EFFECTS[c.up])}</small></div></div></article>`}
function phaseTitle(k){if(k==='draft')return'1 · Draft delle carte';return PHASES.find(x=>x[0]===k)?.[1]||'3 · Pescheria'}
function renderBoard(){
  const me=G.players[0];let cards=me.hand,mode=G.phase==='asta'&&G.auctionStage==='bid'?'bid':G.phase==='privato'?'private':G.phase==='bilancia'&&G.day<4?'keep':'plain',title='La tua mano',enabled=c=>mode!=='private'||canOrder(me,c,true);
  if(G.phase==='draft'){const pack=G.draftPacks[0];cards=[...pack,...G.drafted[0]];mode='draft';title='Carte del draft';enabled=c=>pack.some(x=>x.id===c.id)}
  if(G.phase==='pubblico'){cards=G.public;mode='public';title='Ordini pubblici';enabled=c=>G.publicTurn===0&&canOrder(me,c)}
  if(mode==='bid'&&G.selectedBid)cards=cards.filter(c=>c.id!==G.selectedBid);
  const mid=(cards.length-1)/2,room=innerWidth<900?Math.min(420,innerWidth-40):560,spread=Math.min(72,Math.max(48,(room-180)/Math.max(1,cards.length-1))),fan=cards.map((c,i)=>cardHtml(c,mode,enabled(c),`--i:${i};--x:${(i-mid)*spread}px;--r:${(i-mid)*3.5}deg;--edge:${i===0?32:i===cards.length-1?-32:0}px;--z:${i+1}`)).join('');
  const host=$('boardHand')||$('board');
  const wallet=mode==='bid'?`<div class="bid-wallet"><span>Ducati disponibili</span><button id="bidCoinSource" class="bid-coin-source" ${G.selectedBid&&G.bidCash<me.coins?'':'disabled'} onclick="addBidCoin(event)" aria-label="Aggiungi un Ducato all'offerta"><i></i><i></i><i></i><b id="bidWalletCount">${Math.max(0,me.coins-G.bidCash)}</b></button><small>${G.selectedBid?'Clicca per aggiungere':'Prima scegli una carta'}</small></div>`:'';
  const hint=mode==='draft'?`${G.drafted[0].length} scelte · clicca una carta libera`:['public','private'].includes(mode)?'Passa il mouse e clicca la carta':mode==='keep'?`Clicca per conservare · ${G.keep.size}/2`:'Passa il mouse per leggere la carta';
  host.innerHTML=`<div class="hand-meta"><div class="inventory"><div class="crate"><div class="crate-head"><span>Banco · fresco</span><span>${count(me.fresh)}/${cap(me,'fresh')}</span></div><div class="tokens">${inventoryHtml(me.fresh)}</div></div><div class="crate"><div class="crate-head"><span>Cesta · vecchio</span><span>${count(me.stale)}/6</span></div><div class="tokens">${inventoryHtml(me.stale,true)}</div></div></div><h3>Migliorie</h3><div class="upgrades">${[...me.upgrades].map(u=>`<span class="tag" title="${esc(EFFECTS[u]||'')}">${esc(u)}</span>`).join('')||'<span class="empty">Nessuna ancora</span>'}${[...me.pending].map(u=>`<span class="tag pending">${esc(u)} · domani</span>`).join('')}</div></div><div class="hand-dock"><div class="hand-title"><h3>${title} · ${cards.length}</h3><span>${hint}</span></div>${wallet}<div class="hand-cards">${fan||'<p class="empty">Nessuna carta disponibile.</p>'}</div></div>`;
  requestAnimationFrame(()=>animateHand(host))
}
function animateHand(host){
  const hand=host.querySelector('.hand-cards'),cards=[...host.querySelectorAll('.hand-cards .card')];
  if(!hand||!cards.length||!window.gsap||reducedMotion)return;
  hand.classList.add('gsap-hand');hand.style.setProperty('--rest-bottom',innerHeight<=760?'-117px':'-126px');
  const base=cards.map(c=>({x:+c.style.getPropertyValue('--x').replace('px',''),r:+c.style.getPropertyValue('--r').replace('deg',''),y:c.classList.contains('selected')?-23:0}));
  gsap.set(cards,{xPercent:-50,transformOrigin:'50% 100%',force3D:true});
  gsap.fromTo(cards,{y:110,scale:.78,opacity:0,rotation:i=>base[i].r*1.35},{x:i=>base[i].x,y:i=>base[i].y,rotation:i=>base[i].r,scale:1,opacity:1,duration:.56,stagger:.055,ease:'power3.out',overwrite:true});
  const close=()=>{cards.forEach(c=>{c.classList.remove('gsap-open');c.style.pointerEvents='auto'});gsap.to(cards,{x:i=>base[i].x,y:i=>base[i].y,rotation:i=>base[i].r,rotationX:0,rotationY:0,scale:1,opacity:1,zIndex:i=>i+1,duration:.36,ease:'power3.out',overwrite:true});delete hand.dataset.open};
  const open=index=>{hand.dataset.open=index;cards.forEach((c,i)=>{c.classList.toggle('gsap-open',i===index);c.style.pointerEvents=i===index?'auto':'none'});gsap.to(cards,{x:i=>base[i].x+(i<index?-58:i>index?58:0)+(i===index?(index===0?30:index===cards.length-1?-30:0):0),y:i=>i===index?-104:base[i].y+10,rotation:i=>i===index?0:base[i].r*.72,rotationX:0,rotationY:0,scale:i=>i===index?1.07:.95,opacity:i=>i===index?1:.62,zIndex:i=>i===index?300:i+1,duration:.3,ease:'power3.out',overwrite:true})};
  cards.forEach((card,index)=>{const tiltX=gsap.quickTo(card,'rotationX',{duration:.24,ease:'power3.out'}),tiltY=gsap.quickTo(card,'rotationY',{duration:.24,ease:'power3.out'});let frame=0,lastEvent;card.addEventListener('pointerenter',()=>{if(hand.dataset.open==null)open(index)});card.addEventListener('focusin',()=>open(index));card.addEventListener('pointermove',e=>{if(hand.dataset.open!=index)return;lastEvent=e;if(frame)return;frame=requestAnimationFrame(()=>{const r=card.getBoundingClientRect();tiltX(((lastEvent.clientY-r.top)/r.height-.5)*-6);tiltY(((lastEvent.clientX-r.left)/r.width-.5)*8);frame=0})})});
  hand.addEventListener('pointermove',e=>{const r=hand.getBoundingClientRect();if(e.clientY<r.bottom-145)return;const center=r.left+r.width/2,next=base.reduce((best,c,i)=>Math.abs(e.clientX-center-c.x)<Math.abs(e.clientX-center-base[best].x)?i:best,0);if(hand.dataset.open!=next)open(next)});
  hand.addEventListener('pointerleave',close);
  hand.addEventListener('focusout',e=>{if(!hand.contains(e.relatedTarget))close()});
}
function render(){if(!G)return;$('game').dataset.phase=G.phase;$('dayTitle').textContent=`Giorno ${G.day} di 4 · ${phaseTitle(G.phase==='privato'?'pubblico':G.phase)}`;$('deckInfo').textContent=`Mazzo: ${G.deck.length} · Sacchetto: ${G.bag.length}`;$('progress').innerHTML=PHASES.map(([k,n])=>{const order=['rete','asta','pubblico','bilancia'],actual=G.phase==='draft'?'rete':G.phase==='privato'?'pubblico':G.phase,i=order.indexOf(k),now=order.indexOf(actual);return`<div class="step ${i===now?'active':i<now?'done':''}">${n}</div>`}).join('');renderPhysicalBoard();const scores=G.players.map(scoreCard).join('');$('scores').innerHTML=scores;$('boardScores').innerHTML=scores;renderBoard();$('log').innerHTML=[...G.log].reverse().map(x=>`<div class="logitem"><b>G${x.day} · ${esc(x.phase)}</b>${esc(x.text)}</div>`).join('')}

const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
document.addEventListener('pointermove',e=>{const c=e.target.closest?.('.hand-cards .card');if(!c||reducedMotion||window.gsap)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.setProperty('--tilt-y',`${x*11}deg`);c.style.setProperty('--tilt-x',`${y*-8}deg`)});
document.addEventListener('pointerout',e=>{const c=e.target.closest?.('.hand-cards .card');if(!c||window.gsap||c.contains(e.relatedTarget))return;c.style.removeProperty('--tilt-x');c.style.removeProperty('--tilt-y')});

$('rules').innerHTML=Object.entries(EFFECTS).map(([n,e])=>`<div class="rule"><b>${esc(n)}</b>${esc(e)}</div>`).join('');
// Self-check: the official deck must be complete and every recipe must use a known fish.
console.assert(CARDS.length===100&&CARDS.every(c=>Object.keys(c.recipe).every(f=>FISH.includes(f))&&ASSET.upgrade[c.up]&&ASSET.phase[upgradePhase(c.upgrade)]),'Mazzo Pescaria non valido');
})();
</script>
